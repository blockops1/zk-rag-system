[workspace]
resolver = "2"
members = ["circuit", "prove-bin", "verify-zk-proof", "pipeline_e", "kurier"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# zkVerify fork — same plonky2 API as 0.2.2, but with zkVerify-compatible serialization
plonky2 = { git = "https://github.com/zkVerify/plonky2", tag = "v0.1.0" }
plonky2-verifier = { git = "https://github.com/zkVerify/plonky2-verifier", tag = "v0.2.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
base64 = "0.22"
thiserror = "1.0"
ureq = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
itertools = "0.13"
num = "0.4"
rand = "0.8"
clap = { version = "=4.4.18", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
zk-circuit = { path = "circuit" }
